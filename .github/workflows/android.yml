name: Android CI

on:
  push:
    branches: [ main, redesign/yaqeen-experience ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare stable debug signing key
        run: |
          base64 --decode .github/yaqeen-debug.keystore.b64 > .github/yaqeen-debug.keystore
          keytool -list -keystore .github/yaqeen-debug.keystore -storetype PKCS12 -storepass yaqeenDebugStore2026 -alias yaqeen-debug

      - name: Download and verify offline Arabic tafsir
        run: python3 scripts/fetch_offline_tafsir.py

      - name: Download and build offline Arabic hadith library
        run: python3 scripts/fetch_offline_hadith.py

      - name: Build debug APK
        run: gradle -PYAQEEN_VERSION_CODE=${{ github.run_number }} -PQF_PROXY_BASE_URL="${{ vars.QF_PROXY_BASE_URL }}" assembleDebug

      - name: Run Quran integrity unit tests
        run: gradle -PYAQEEN_VERSION_CODE=${{ github.run_number }} -PQF_PROXY_BASE_URL="${{ vars.QF_PROXY_BASE_URL }}" testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaqeen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
